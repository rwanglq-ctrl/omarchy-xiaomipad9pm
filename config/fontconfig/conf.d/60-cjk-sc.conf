<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 50-omarchy.conf strong-assigns sans-serif/serif to Liberation, so the stock
     Noto CJK lang=zh-cn rules never match and Han falls back to "Noto Sans CJK JP"
     (Japanese glyph shapes). Append Chinese faces as last-resort families so they
     never displace Latin/mono/emoji families:
       - serif requests (already rewritten to Liberation Serif) get Noto Serif CJK SC first
       - everything gets Noto Sans CJK SC, then WenQuanYi Micro Hei -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Liberation Serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK SC</string>
      <string>WenQuanYi Micro Hei</string>
    </edit>
  </match>
</fontconfig>
